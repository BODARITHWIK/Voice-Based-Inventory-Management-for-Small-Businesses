services:
  # ========================================================
  # Spring Boot Backend Web Service
  # ========================================================
  - type: web
    name: swaranidhi-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: swaranidhi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PORT
        value: 8080

  # ========================================================
  # React Frontend Static Site
  # ========================================================
  - type: web
    name: swaranidhi-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: swaranidhi-backend
          property: host

databases:
  # ========================================================
  # Render PostgreSQL Database
  # ========================================================
  - name: swaranidhi-db
    databaseName: swaranidhi
    user: swaranidhi_user
    plan: free
    region: oregon
