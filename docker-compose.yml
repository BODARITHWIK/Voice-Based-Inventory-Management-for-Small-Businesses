version: '3.8'

services:
  # =======================================================
  # PostgreSQL Database Service
  # =======================================================
  postgres:
    image: postgres:16-alpine
    container_name: swaranidhi-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swaranidhi_db}
      POSTGRES_USER: ${POSTGRES_USER:-swaranidhi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swaranidhi_pass123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swaranidhi_user} -d ${POSTGRES_DB:-swaranidhi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swaranidhi-network

  # =======================================================
  # Spring Boot Backend Service
  # =======================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swaranidhi-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-swaranidhi_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-swaranidhi_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-swaranidhi_pass123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-swaranidhi-production-super-secret-jwt-key-min-256-bits-length!}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - swaranidhi-network

  # =======================================================
  # React + Nginx Frontend Service
  # =======================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swaranidhi-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - swaranidhi-network

volumes:
  pgdata:
    driver: local

networks:
  swaranidhi-network:
    driver: bridge
