server.port=8080

# Application info
spring.application.name=swaranidhi-backend

# Data Source: Defaults to embedded H2 in PostgreSQL mode for instant local runs, or PostgreSQL via DATABASE_URL
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:swaranidhidb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# Security & JWT Configuration
swaranidhi.jwt.secret=${JWT_SECRET:swaranidhiSecureJwtSecretKeyForShopkeeperInventorySystem2026!}
swaranidhi.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# CORS Configuration
swaranidhi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.swaranidhi=INFO
logging.level.org.springframework.security=WARN

# Voice & Multilingual Provider Configuration (Section 45)
swaranidhi.voice.speech-provider=${SPEECH_PROVIDER:browser}
swaranidhi.voice.speech-api-key=${SPEECH_API_KEY:}
swaranidhi.voice.speech-region=${SPEECH_REGION:centralindia}
swaranidhi.voice.ai-provider=${AI_PROVIDER:internal}
swaranidhi.voice.ai-api-key=${AI_API_KEY:}
swaranidhi.voice.tts-provider=${TTS_PROVIDER:browser}
# Vision & AI Stock Photo Analysis Provider Configuration
swaranidhi.vision.provider=${VISION_PROVIDER:local}
swaranidhi.vision.google.api-key=${GOOGLE_VISION_API_KEY:}
swaranidhi.vision.azure.api-key=${AZURE_VISION_KEY:}
swaranidhi.vision.azure.endpoint=${AZURE_VISION_ENDPOINT:}

