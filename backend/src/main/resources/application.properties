server.port=${PORT:8080}

# Application info
spring.application.name=swaranidhi-backend

# Database: PostgreSQL by default when DATABASE_URL or SPRING_DATASOURCE_URL is provided; H2 in-memory for zero-config local dev & tests
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:swaranidhidb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# Swaranidhi JWT Security Configuration (In production, SWARANIDHI_JWT_SECRET environment variable is strictly required)
swaranidhi.jwt.secret=${SWARANIDHI_JWT_SECRET:${JWT_SECRET:dev-only-local-insecure-jwt-secret-do-not-use-in-production-min-256-bits!}}
swaranidhi.jwt.expiration-ms=${SWARANIDHI_JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
swaranidhi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:80,http://localhost}